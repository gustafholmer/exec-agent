# What a session may do with the Canvas connector.
#
# A tool with no rule here falls through to the gate's `approve` default, so
# the list is checked against the server's registered tools in both
# directions by ea-canvas's policy-coverage tests.
[canvas]
list_courses = "auto"
list_assignments = "auto"
list_upcoming = "auto"
watch_poll = "auto"

# No such tool exists, and none should. The gate matches a rule by name, so
# declaring the denial now means it is already in force if anybody ever adds
# one: a session must never be able to hand in the user's coursework.
submit_assignment = "deny"
