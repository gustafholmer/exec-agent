# What a session may do with the Notion connector.
#
# A tool with no rule here falls through to the gate's `approve` default, so
# the list is checked against the server's registered tools in both directions
# by ea-notion's policy-coverage tests
# (`tools::tests::every_registered_tool_has_a_policy_rule` and
# `every_policy_rule_names_a_registered_tool_or_a_deliberate_placeholder`).
#
# The section name must be this directory's basename: `Policy::load_dirs`
# rejects a connector that declares a foreign section, because a policy file
# that could name another connector would be a privilege-escalation path.
#
# # The line this file exists to argue
#
# `create_page` is the first write in this project that runs without a human
# tap. Every other connector's writes are `approve`, and the difference is
# NOT "additive vs. edits existing" — `append_to_page` is append-only too, so
# that framing does not actually separate the two calls. The real asymmetry
# is reversal cost and ownership.
#
# A stray page is one object: it lands in the owner's sidebar where they will
# see it, and undoing a mistake is one click — trash the page. A stray
# paragraph appended to a page the owner already maintains — their meeting
# notes, their project doc, the thing they trust and will read next week —
# has to be found block-by-block inside a document someone else reads and
# writes, and may simply never be noticed. That is what the gate is
# protecting: whose work is at stake and how cheaply a mistake is undone, not
# how much either call touches.
#
# Also worth being honest about: creating a page does not "cost nothing". In
# a shared business workspace it can notify collaborators and trigger Notion
# automations (a database's own automations, a linked webhook) — real side
# effects, just cheap and reversible ones. The `auto` grade rests on that
# reversal-cost gap, not on the write being free.
[notion]

# Reads. Nothing posted, nothing changed.
search = "auto"
get_page = "auto"
query_database = "auto"

# The daemon's timer calls this one, with no session involved.
watch_poll = "auto"

# The deliberate departure. See the argument above; a bare "auto" here would
# read as an oversight.
create_page = { mode = "auto", note = "a stray page is reversible in one click -- the owner deletes it wholesale -- while a stray paragraph from append_to_page must be found block-by-block inside a trusted document and might never be noticed; that reversal-cost gap, not 'costs nothing', is why this one is auto (it can still notify collaborators or fire automations in a shared workspace)" }

# Additive too, but to someone else's page. See above.
append_to_page = "approve"

# No such tools exist, and none should. The gate matches a rule by name, so
# declaring the denial now means it is already in force if anybody ever adds
# one. This connector may add to the owner's Notion; it may never remove from
# it — and `create_page` being `auto` rests entirely on that asymmetry, so
# these two lines are what makes the line above safe.
delete_page = "deny"
archive_page = "deny"
