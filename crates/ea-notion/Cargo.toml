[package]
name = "ea-notion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ea_notion"
path = "src/lib.rs"

# The connector binary: the stdio MCP server the daemon spawns. Named for the
# connector, because `connectors/notion/connector.toml` resolves `command`
# against the directory holding `ea-daemon` and then $PATH.
[[bin]]
name = "ea-notion"
path = "src/main.rs"

[dependencies]
ea-core = { path = "../ea-core" }
anyhow.workspace = true
chrono.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
wiremock.workspace = true
