[package]
name = "ea-kth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ea_kth"
path = "src/lib.rs"

# The file is `src/bin/authorize.rs`, mirroring `ea-google`, but the binary it
# installs is named for the connector: the string an error message tells
# somebody to run has to be the string that actually works, and `authorize`
# alone is far too generic a name to put on a $PATH.
[[bin]]
name = "ea-kth-authorize"
path = "src/bin/authorize.rs"

# The connector binary: the stdio MCP server the daemon spawns. Named for the
# connector, because `connectors/kth/connector.toml` resolves `command`
# against the directory holding `ea-daemon` and then $PATH.
[[bin]]
name = "ea-kth"
path = "src/main.rs"

[dependencies]
ea-core = { path = "../ea-core" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
wiremock.workspace = true
